name: CI (fork)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/new-ui
  pull_request:
    branches:
      - main
      - feat/new-ui

concurrency:
  group: ci-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: resources/app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: resources/app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php:
          - 8.2
          - 8.3
    services:
      database:
        image: mariadb:11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306
    steps:
      - uses: actions/checkout@v4

      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, cli, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - run: cp .env.ci .env

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Unit tests
        run: vendor/bin/phpunit --bootstrap vendor/autoload.php tests/Unit
        env:
          DB_HOST: UNIT_NO_DB

      - name: Integration tests
        run: vendor/bin/phpunit tests/Integration
        env:
          DB_PORT: ${{ job.services.database.ports[3306] }}
          DB_USERNAME: root

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: resources/app/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: resources/app

      - name: Build the frontend
        run: pnpm build
        working-directory: resources/app

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: resources/app

      - name: Start the panel
        run: |
          docker compose -f compose.dev.yml up -d database cache panel
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8080/auth/login; then
              echo "panel is up"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "panel did not come up in time"
              docker compose -f compose.dev.yml logs panel
              exit 1
            fi
            sleep 5
          done
          docker compose -f compose.dev.yml exec -T panel php artisan migrate --force --seed
          docker compose -f compose.dev.yml exec -T panel php artisan p:user:make \
            --email=e2e@example.com --username=e2e --name-first=E2E --name-last=Tester \
            --password=Password123! --admin=1

      - name: Run end-to-end tests
        run: pnpm test:e2e
        working-directory: resources/app
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_USERNAME: e2e
          E2E_PASSWORD: Password123!

      - name: Panel logs
        if: failure()
        run: docker compose -f compose.dev.yml logs panel

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: resources/app/playwright-report
          retention-days: 7
